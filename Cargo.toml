[package]
name        = "fosdem-video-downloader"
version     = "0.2.0"
edition     = "2024"
description = "Download FOSDEM conference videos from an ICS schedule file."
repository  = "https://github.com/butlerx/fosdem-video-downloader"
license     = "Apache-2.0"

[dependencies]
clap       = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
ical       = "0.11"
log        = "0.4"
rayon      = "1.10"
thiserror  = "2.0"

[dependencies.reqwest]
version          = "0.12"
default-features = false
features         = ["blocking", "rustls-tls"]
